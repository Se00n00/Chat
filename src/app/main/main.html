<div class="relative flex justify-center items-center">
    <div class="w-full z-10 absolute transition-colors duration-500">
        <div class="relative flex justify-center">

            <div class="relative w-10/12 max-w-4xl">
                <input
                    type="text"
                    [ngModel]="text()"
                    (ngModelChange)="onUserNameChange($event)"
                    placeholder="Ask to Hydra, You shall receive Answer"
                    class="w-full pr-12 text-sm bg-gray-500/[0.1] backdrop-blur-md px-3.5 py-2
                           rounded-md border dark:border-white/[0.3]
                           dark:text-white/[0.5]
                           focus:outline-none focus:border-gray-500
                           dark:focus:border-gray-400
                           focus:text-gray-500 dark:focus:text-gray-200
                           transition-colors duration-300"
                />


                <button
                    type="button"
                    (click)="ask()"
                    (keyup.enter)="ask()"
                    class="absolute right-[3px] cursor-pointer top-1/2 -translate-y-1/2
                        hover:text-white transition-all text-xs bg-black/[0.8] dark:bg-white/[0.1] dark:text-white/[0.5] dark:hover:text-white text-white/[0.5] mx-1 rounded-sm p-1 shadow-[2px_2px_0px_rgba(0,0,0,0.56)] dark:shadow-[2px_2px_0px_#ffffff30]
                        dark:active:shadow-[1px_1px_0px_#ffffff30]
                        dark:border-white/[0.1] dark:border
                        duration-100
                        "
                >
                [<span class="font-semibold">Enter</span>]
                </button>
            </div>
        </div>
    </div>

    <img src="pixel_dither.png" alt="" class="select-none grayscale">
</div>
